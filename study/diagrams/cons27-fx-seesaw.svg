<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="원화 강세의 득실: 음식료는 득, 화장품·의류 OEM·소매유통 인바운드는 실">
  <defs><marker id="cons27-fx-seesawA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="dg-arrowhead"/></marker></defs>
  <text x="380" y="22" class="dg-t" font-size="14" font-weight="800" text-anchor="middle">같은 환율, 반대 효과 — 원화 강세는 누구에게 좋은가</text>
  <rect x="270" y="40" width="220" height="92" rx="8" class="dg-lane1"/>
  <text x="380.0" y="59" class="dg-t" font-size="12" font-weight="700" text-anchor="middle">원/달러 (NH)</text>
  <text x="380.0" y="76" class="dg-t" font-size="10" font-weight="700" text-anchor="middle">2Q26 고점 1,549원 → 하반기 1,300원대</text>
  <text x="380.0" y="93" class="dg-s" font-size="10" text-anchor="middle">2027F 1Q 1,340 → 4Q 1,400</text>
  <text x="380.0" y="110" class="dg-s" font-size="10" text-anchor="middle">평균 1,370원: 상반기 강세, 하반기 완만한 약세</text>
  <rect x="10" y="160" width="360" height="160" rx="8" class="dg-lane2"/>
  <text x="20" y="179" class="dg-t" font-size="12" font-weight="700" text-anchor="start">득 — 원재료를 사오는 쪽</text>
  <text x="20" y="196" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">음식료: 소맥·대두·원당·코코아 대부분 수입</text>
  <text x="20" y="213" class="dg-s" font-size="10.5" text-anchor="start">원가율 하락 요인 (NH 원가 부담 완화의 1번 근거)</text>
  <text x="20" y="230" class="dg-s" font-size="10.5" text-anchor="start">롯데웰푸드: 10원 하락 = 영업이익 +20억원</text>
  <text x="20" y="247" class="dg-s" font-size="10.5" text-anchor="start">  4Q 평균이 2Q보다 약 160원 낮음 → 리드타임 2분기</text>
  <text x="20" y="264" class="dg-s" font-size="10.5" text-anchor="start">해외 법인 이익의 원화 환산은 줄어드는 점은 반대 방향</text>
  <rect x="390" y="160" width="360" height="160" rx="8" class="dg-lane3"/>
  <text x="400" y="179" class="dg-t" font-size="12" font-weight="700" text-anchor="start">실 — 달러로 파는 쪽</text>
  <text x="400" y="196" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">화장품 브랜드사: 해외 매출 환산↓ + 원가율↑</text>
  <text x="400" y="213" class="dg-s" font-size="10.5" text-anchor="start">  → 3Q26 영업이익 기대치 하회, 12MF PER 12.5배(최저)</text>
  <text x="400" y="230" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">ODM: 매출 대부분 원화 → 상대적으로 안정</text>
  <text x="400" y="247" class="dg-s" font-size="10.5" text-anchor="start">의류 OEM: 달러 수주 → 상반기까지 역풍, 하반기 반등</text>
  <text x="400" y="264" class="dg-s" font-size="10.5" text-anchor="start">소매유통: 외국인 쇼핑 가격 매력↓ (그래도 카드 +48.8%)</text>
  <line x1="330" y1="132" x2="200" y2="158" class="dg-arrow" marker-end="url(#cons27-fx-seesawA)"/>
  <line x1="430" y1="132" x2="560" y2="158" class="dg-arrow" marker-end="url(#cons27-fx-seesawA)"/>
  <rect x="10" y="335" width="740" height="75" rx="8" class="dg-panel"/>
  <text x="20" y="356" class="dg-t" font-size="11.5" font-weight="700" text-anchor="start">읽는 법</text>
  <text x="20" y="376" class="dg-s" font-size="10.5" text-anchor="start">같은 NH 안에서 음식료는 "원화 강세 지속이 우호적", 화장품은 "하반기 원화 약세로 원가 부담 완화"를 말한다. 두 말은 모순이 아니라</text>
  <text x="20" y="395" class="dg-s" font-size="10.5" text-anchor="start">상반기 강세 → 하반기 완만한 약세라는 한 경로를 양쪽에서 본 것이다. 환율이 예상보다 더 내려가면 음식료는 더 좋아지고 화장품은 더 나빠진다.</text>
</svg>
