<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="지도의 사각지대: 중국 바벨 전략과 베트남 자본시장 개방 경로">
  <defs><marker id="strategy-regionsA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="dg-arrowhead"/></marker></defs>
  <text x="360" y="20" class="dg-t" font-size="14" font-weight="800" text-anchor="middle">독자적 모멘텀: 중국은 바벨, 베트남은 돈길 열기</text>
  <rect x="10" y="34" width="345" height="396" rx="8" class="dg-lane1"/>
  <text x="182" y="56" class="dg-t" font-size="12.5" font-weight="800" text-anchor="middle">중국 — AI가 끌고 정책이 받친다</text>
  <text x="20" y="82" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">밴드 3,350~4,000P</text>
  <text x="20" y="108" class="dg-s" font-size="10.5" text-anchor="start">EPS 306.8위안 × PER 13배 ≈ 3,990</text>
  <text x="20" y="134" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">공격: AI 업종</text>
  <text x="20" y="160" class="dg-s" font-size="10.5" text-anchor="start">광모듈·PCB 점유율 ≈60% · AI 이익 93%는 HW</text>
  <text x="20" y="186" class="dg-s" font-size="10.5" text-anchor="start">토큰 호출 점유율 45% (싼 모델)</text>
  <text x="20" y="212" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">방어: 고배당</text>
  <text x="20" y="238" class="dg-s" font-size="10.5" text-anchor="start">SFISF 3차 1,000억위안 · 국가대표팀</text>
  <text x="20" y="264" class="dg-s" font-size="10.5" text-anchor="start">자사주 대출 금리 1.25 → 1.00%</text>
  <text x="20" y="290" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">위험</text>
  <text x="20" y="316" class="dg-s" font-size="10.5" text-anchor="start">수출 +21.3% vs 고정자산 −7.2%</text>
  <text x="20" y="342" class="dg-s" font-size="10.5" text-anchor="start">AI 투자 &lt; 부동산 감소 (보전율 ≈66%)</text>
  <text x="20" y="368" class="dg-s" font-size="10.5" text-anchor="start">10월 21차 당대회 · 미국 대중 규제</text>
  <rect x="365" y="34" width="345" height="396" rx="8" class="dg-lane3"/>
  <text x="537" y="56" class="dg-t" font-size="12.5" font-weight="800" text-anchor="middle">베트남 — 은행 하나에서 일곱 갈래로</text>
  <text x="375" y="82" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">필요: 5년 1.46조$ (직전의 2배)</text>
  <text x="375" y="108" class="dg-s" font-size="10.5" text-anchor="start">연 10% 성장 · 투자/GDP 30%대 → 40%</text>
  <text x="375" y="134" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">지금: 은행 대출 의존</text>
  <text x="375" y="160" class="dg-s" font-size="10.5" text-anchor="start">신용/GDP 145% (BB 중앙값 ≈50%)</text>
  <text x="375" y="186" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">열리는 길</text>
  <text x="375" y="212" class="dg-s" font-size="10.5" text-anchor="start">주식: FTSE EM 20·35·35% → MSCI EM</text>
  <text x="375" y="238" class="dg-s" font-size="10.5" text-anchor="start">국채 18 → 33% · 회사채 11 → 25% (GDP 대비)</text>
  <text x="375" y="264" class="dg-s" font-size="10.5" text-anchor="start">해외차입 한도 61억 → 100억$</text>
  <text x="375" y="290" class="dg-s" font-size="10.5" text-anchor="start">FDI 연 300억~400억$ · VIFC (2026.2)</text>
  <text x="375" y="316" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">신호</text>
  <text x="375" y="342" class="dg-s" font-size="10.5" text-anchor="start">예금금리 ≈8% → 하향 안정 = 지수 우상향</text>
  <text x="375" y="368" class="dg-s" font-size="10.5" text-anchor="start">6월 MSCI 관찰국 등재 여부</text>
</svg>
