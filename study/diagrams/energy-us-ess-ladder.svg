<svg viewBox="0 0 720 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2027년 미국 ESS 숫자 사다리: 하우스별 75~185GWh가 정의 차이로 갈리는 구조">
  <text x="360" y="20" text-anchor="middle" class="dg-t" font-size="14" font-weight="800">같은 '2027년 미국 ESS'가 75~185GWh — 무엇을 세느냐의 차이</text>
  <!-- 눈금: x=250 → 0, 1GWh = 2.2px (200 → 690) -->
  <g font-size="10" class="dg-m">
    <line x1="250" y1="44" x2="250" y2="366" class="dg-axis"/>
    <line x1="360" y1="44" x2="360" y2="366" class="dg-div"/><text x="360" y="378" text-anchor="middle" class="dg-m">50</text>
    <line x1="470" y1="44" x2="470" y2="366" class="dg-div"/><text x="470" y="378" text-anchor="middle" class="dg-m">100</text>
    <line x1="580" y1="44" x2="580" y2="366" class="dg-div"/><text x="580" y="378" text-anchor="middle" class="dg-m">150</text>
    <line x1="690" y1="44" x2="690" y2="366" class="dg-div"/><text x="690" y="378" text-anchor="middle" class="dg-m">200</text>
    <text x="250" y="378" text-anchor="middle" class="dg-m">0 GWh</text>
  </g>
  <!-- 단 구분 -->
  <rect x="10" y="44" width="122" height="84" rx="6" class="dg-lane1"/>
  <text x="18" y="64" class="dg-t" font-size="12" font-weight="800">설치 기준</text>
  <text x="18" y="80" class="dg-s" font-size="10">EIA·SEIA 집계 GW</text>
  <text x="18" y="94" class="dg-s" font-size="10">× 지속시간 2.8~3.2h</text>
  <text x="18" y="108" class="dg-s" font-size="10">= 실제로 깔린 양</text>
  <rect x="10" y="134" width="122" height="104" rx="6" class="dg-lane2"/>
  <text x="18" y="154" class="dg-t" font-size="12" font-weight="800">수요 기준</text>
  <text x="18" y="170" class="dg-s" font-size="10">계통 큐 환산·적격 셀</text>
  <text x="18" y="184" class="dg-s" font-size="10">수요 추정</text>
  <text x="18" y="198" class="dg-s" font-size="10">(비중국만 셀지 여부도</text>
  <text x="18" y="212" class="dg-s" font-size="10">갈린다)</text>
  <rect x="10" y="244" width="122" height="122" rx="6" class="dg-lane3"/>
  <text x="18" y="264" class="dg-t" font-size="12" font-weight="800">출하 기준</text>
  <text x="18" y="280" class="dg-s" font-size="10">셀 공장에서 나간 양</text>
  <text x="18" y="294" class="dg-s" font-size="10">설치보다 앞서 잡힘</text>
  <text x="18" y="308" class="dg-s" font-size="10">재고·세이프하버 포함</text>
  <!-- 막대들 -->
  <g font-size="11">
    <!-- 신한 75~81 -->
    <text x="140" y="68" class="dg-t" font-weight="700">신한</text><text x="140" y="81" class="dg-s" font-size="9.5">EIA 26.9GW×2.8~3h</text>
    <rect x="250" y="58" width="165" height="16" rx="3" class="dg-mid"/><rect x="415" y="58" width="13" height="16" rx="3" class="dg-band"/>
    <text x="434" y="71" class="dg-t" font-weight="800">≈75~81</text>
    <!-- 대신 79~81 -->
    <text x="140" y="106" class="dg-t" font-weight="700">대신</text><text x="140" y="119" class="dg-s" font-size="9.5">미국 BESS 설치</text>
    <rect x="250" y="96" width="174" height="16" rx="3" class="dg-mid"/>
    <text x="430" y="109" class="dg-t" font-weight="800">79 (10월판 80.6)</text>
    <!-- 유안타 85 / 106 -->
    <text x="140" y="154" class="dg-t" font-weight="700">유안타</text><text x="140" y="167" class="dg-s" font-size="9.5">북미 셀수요 Base</text>
    <rect x="250" y="146" width="187" height="16" rx="3" class="dg-hi"/><rect x="437" y="146" width="46" height="16" rx="3" class="dg-mid"/>
    <text x="489" y="159" class="dg-t" font-weight="800">106</text>
    <text x="300" y="158" class="dg-t" font-size="10" font-weight="700">비중국 적격 85</text>
    <!-- DB 100+ -->
    <text x="140" y="190" class="dg-t" font-weight="700">DB</text><text x="140" y="203" class="dg-s" font-size="9.5">FTM, 계통 큐 환산</text>
    <rect x="250" y="182" width="220" height="16" rx="3" class="dg-hi"/>
    <text x="476" y="195" class="dg-t" font-weight="800">연 105 (~2030 평균)</text>
    <!-- 메리츠 126 -->
    <text x="140" y="226" class="dg-t" font-weight="700">메리츠</text><text x="140" y="239" class="dg-s" font-size="9.5">미국 수요 (DC 31 포함)</text>
    <rect x="250" y="218" width="277" height="16" rx="3" class="dg-hi"/>
    <text x="533" y="231" class="dg-t" font-weight="800">126</text>
    <!-- NH 150 (FTM 125 + BTM 25) -->
    <text x="140" y="270" class="dg-t" font-weight="700">NH</text><text x="140" y="283" class="dg-s" font-size="9.5">미국 출하 (BTM 25 포함)</text>
    <rect x="250" y="262" width="275" height="16" rx="3" class="dg-ok"/><rect x="525" y="262" width="55" height="16" rx="3" class="dg-mid"/>
    <text x="586" y="275" class="dg-t" font-weight="800">150</text>
    <text x="300" y="274" class="dg-t" font-size="10" font-weight="700">FTM 125</text>
    <!-- 미래 160 -->
    <text x="140" y="306" class="dg-t" font-weight="700">미래에셋</text><text x="140" y="319" class="dg-s" font-size="9.5">미국 셀 출하</text>
    <rect x="250" y="298" width="352" height="16" rx="3" class="dg-ok"/>
    <text x="608" y="311" class="dg-t" font-weight="800">≈160</text>
    <!-- iM 185 -->
    <text x="140" y="342" class="dg-t" font-weight="700">iM</text><text x="140" y="355" class="dg-s" font-size="9.5">북미 출하·수요</text>
    <rect x="250" y="334" width="407" height="16" rx="3" class="dg-ok"/>
    <text x="663" y="347" class="dg-t" font-weight="800">185</text>
    <text x="657" y="362" class="dg-s" font-size="9.5" text-anchor="end">중간선거 후 시나리오 182</text>
  </g>
  <!-- 설명 -->
  <rect x="10" y="388" width="700" height="62" rx="6" class="dg-band"/>
  <text x="22" y="407" class="dg-t" font-size="11.5" font-weight="700">2.5배 차이의 네 원인: ① 설치 vs 셀 출하 ② 미국 vs 북미 ③ 지속시간 가정(2.8h vs 3.5h면 25% 차이) ④ 비중국 적격분만 세는지</text>
  <text x="22" y="425" class="dg-s" font-size="11">셀사 실적에 직접 연결되는 숫자는 '출하'다. 설치 기준 숫자를 보고 "수요가 작다"고 읽으면 안 된다.</text>
  <text x="22" y="442" class="dg-m" font-size="10">출처: 신한 p.16, 대신 11월 p.17, 유안타 p.22, DB p.18, 메리츠 p.25, 미래 p.12(눈금 읽기), iM p.18, NH p.33. 신한의 GWh는 GW에 시간을 곱한 계산.</text>
</svg>
