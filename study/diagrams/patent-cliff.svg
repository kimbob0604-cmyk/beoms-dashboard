<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PD-(L)1 특허 절벽과 빅파마의 세 가지 대응: SC 제형 방어, 병용, 대체">
  <!-- 시간축 2025~2041 : x = 120 + (연도-2025)*36 -->
  <g font-size="11" class="dg-m">
    <line x1="120" y1="44" x2="708" y2="44" class="dg-axis"/>
    <text x="120" y="36" text-anchor="middle">2025</text>
    <text x="228" y="36" text-anchor="middle">2028</text>
    <text x="300" y="36" text-anchor="middle">2030</text>
    <text x="480" y="36" text-anchor="middle">2035</text>
    <text x="696" y="36" text-anchor="middle">2041</text>
  </g>
  <rect x="228" y="48" width="72" height="230" class="dg-band"/>
  <text x="264" y="18" text-anchor="middle" class="dg-no" font-size="11.5" font-weight="700">특허 만료 집중</text>
  <text x="264" y="292" text-anchor="middle" class="dg-m" font-size="10.5">상위 5개 약 + 메디케어</text>
  <text x="264" y="306" text-anchor="middle" class="dg-m" font-size="10.5">약가협상 (2028~2030)</text>

  <g font-size="12">
    <!-- 방어: SC -->
    <text x="8" y="76" class="dg-t" font-weight="800">방어</text>
    <text x="8" y="92" class="dg-m" font-size="11">SC 제형</text>
    <rect x="120" y="62" width="576" height="34" rx="8" class="dg-lane1"/>
    <text x="130" y="78" class="dg-t" font-weight="700">키트루다 Qlex (알테오젠) · 옵디보 Qvantig (할로자임)</text>
    <text x="130" y="92" class="dg-s" font-size="11">SC 비중 3Q26 약 10%·12% → 목표 만료 전 30~40%. IV 바이오시밀러가 대체 못 함</text>
    <path d="M688 66 L696 66 L696 92 L688 92" class="dg-link" fill="none"/>
    <text x="700" y="112" text-anchor="end" class="dg-m" font-size="10.5">Qlex 특허 ~2041 (분석)</text>

    <!-- 병용 -->
    <text x="8" y="146" class="dg-t" font-weight="800">병용</text>
    <text x="8" y="162" class="dg-m" font-size="11">파트너 쌓기</text>
    <rect x="120" y="128" width="576" height="58" rx="8" class="dg-lane2"/>
    <text x="130" y="146" class="dg-t" font-weight="700">백본이 싸져도 위에 얹은 약은 자기 특허 → 주로 ADC</text>
    <text x="130" y="163" class="dg-s" font-size="11">머크: 켈룬 ADC 7종(sac-TMT) · 다이이찌 DXd ADC 3종(계약금 40억 달러) · KRAS · mRNA 백신 인티스메란</text>
    <text x="130" y="178" class="dg-s" font-size="11">AZ: 다트로웨이 · CLDN18.2 ADC Sone-Ve 를 임핀지와 묶음</text>

    <!-- 대체 -->
    <text x="8" y="218" class="dg-t" font-weight="800">대체</text>
    <text x="8" y="234" class="dg-m" font-size="11">새 백본</text>
    <rect x="120" y="200" width="576" height="58" rx="8" class="dg-lane3"/>
    <text x="130" y="218" class="dg-t" font-weight="700">새 특허 물질로 같은 자리 → 거의 PD-(L)1×VEGF 이중항체</text>
    <text x="130" y="235" class="dg-s" font-size="11">AZ: 서밋에 20억 달러 투자(이보네시맙) · BMS: 바이오엔텍 푸미타미그(계약금 15억 + 20억 달러)</text>
    <text x="130" y="250" class="dg-s" font-size="11">머크: LaNova MK-2010 — 차기 1차 폐암 시험에서 키트루다 대신 쓰는 안까지 검토</text>
  </g>
</svg>
