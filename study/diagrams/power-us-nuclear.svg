<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="미국 원전: DOE·DOC 두 갈래 자금이 장납기 기자재 선발주로 이어지는 구조와 한국 기업의 자리">
  <defs><marker id="power-us-nuclearA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="dg-arrowhead"/></marker></defs>
  <text x="360" y="20" class="dg-t" font-size="14" font-weight="800" text-anchor="middle">미국 원전: 돈이 먼저 정해지고, 첫 발주는 장납기 기자재다</text>
  <rect x="10" y="34" width="300" height="120" rx="8" class="dg-lane1"/>
  <text x="20" y="56" class="dg-t" font-size="12" font-weight="700" text-anchor="start">DOE 트랙 (에너지부)</text>
  <text x="20" y="75" class="dg-s" font-size="10.5" text-anchor="start">공급망 대출 최대 175억 달러 (2026.6)</text>
  <text x="20" y="94" class="dg-s" font-size="10.5" text-anchor="start">AP1000 10기 = 2기 × 5개 부지</text>
  <text x="20" y="113" class="dg-s" font-size="10.5" text-anchor="start">부지별 SPV 45억 = DOE 35 + 유틸 5 + WEC 5</text>
  <text x="20" y="132" class="dg-s" font-size="10.5" text-anchor="start">연말~연초 부지 배정 (KB·메리츠)</text>
  <rect x="10" y="164" width="300" height="110" rx="8" class="dg-lane2"/>
  <text x="20" y="186" class="dg-t" font-size="12" font-weight="700" text-anchor="start">DOC 트랙 (상무부 · 대미투자)</text>
  <text x="20" y="204" class="dg-s" font-size="10.5" text-anchor="start">최대 1,200억 달러, 8기</text>
  <text x="20" y="222" class="dg-s" font-size="10.5" text-anchor="start">AP1000 6 + APR1400 2 (하나·신한)</text>
  <text x="20" y="240" class="dg-s" font-size="10.5" text-anchor="start">선급금 100억 중 약 75억 → AP1000 LLI</text>
  <text x="20" y="258" class="dg-s" font-size="10.5" text-anchor="start">EPC 본계약은 2028년 기대 (메리츠)</text>
  <path d="M310 94 C330 94, 330 150, 346 150" class="dg-arrow" marker-end="url(#power-us-nuclearA)"/>
  <path d="M310 219 C330 219, 330 160, 346 160" class="dg-arrow" marker-end="url(#power-us-nuclearA)"/>
  <rect x="350" y="110" width="160" height="90" rx="8" class="dg-hi"/>
  <text x="360" y="132" class="dg-t" font-size="12" font-weight="700" text-anchor="start">장납기 선발주</text>
  <text x="360" y="150" class="dg-s" font-size="10.5" text-anchor="start">원자로용기 42~54개월</text>
  <text x="360" y="168" class="dg-s" font-size="10.5" text-anchor="start">증기발생기 36~48개월</text>
  <text x="360" y="186" class="dg-s" font-size="10.5" text-anchor="start">→ 공기 약 3년 단축</text>
  <path d="M510 155 L526 155" class="dg-arrow" marker-end="url(#power-us-nuclearA)"/>
  <rect x="530" y="34" width="180" height="240" rx="8" class="dg-lane3"/>
  <text x="540" y="56" class="dg-t" font-size="12" font-weight="700" text-anchor="start">그다음 순서</text>
  <text x="540" y="77" class="dg-s" font-size="10.5" text-anchor="start">2026말~27초</text>
  <text x="540" y="98" class="dg-s" font-size="10.5" text-anchor="start">  LLI 발주 (약 4기분)</text>
  <text x="540" y="119" class="dg-s" font-size="10.5" text-anchor="start">2027 하반기~2028</text>
  <text x="540" y="140" class="dg-s" font-size="10.5" text-anchor="start">  FID (최종 투자결정)</text>
  <text x="540" y="161" class="dg-s" font-size="10.5" text-anchor="start">2030년까지</text>
  <text x="540" y="182" class="dg-s" font-size="10.5" text-anchor="start">  10기 착공 목표</text>
  <text x="540" y="203" class="dg-s" font-size="10.5" text-anchor="start">2050년 원전 400GW</text>
  <text x="540" y="224" class="dg-s" font-size="10.5" text-anchor="start">  (현재 94기·약 97GW)</text>
  <rect x="10" y="284" width="345" height="156" rx="8" class="dg-panel"/>
  <text x="20" y="306" class="dg-t" font-size="12" font-weight="700" text-anchor="start">경제성은 Vogtle와 다르다</text>
  <text x="20" y="327" class="dg-s" font-size="10.5" text-anchor="start">Vogtle 3·4 순건설비 15,000달러/kW</text>
  <text x="20" y="348" class="dg-s" font-size="10.5" text-anchor="start">  = 초기 8,300 + FOAK 2,900 + 비효율 3,800</text>
  <text x="20" y="369" class="dg-s" font-size="10.5" text-anchor="start">48E 공제: 기본 6% → 30% → 최대 50%</text>
  <text x="20" y="390" class="dg-s" font-size="10.5" text-anchor="start">하이퍼스케일러 장기 PPA (7건, KB)</text>
  <text x="20" y="411" class="dg-s" font-size="10.5" text-anchor="start">CWIP 주(GA·SC·NC)가 먼저 짓는다</text>
  <rect x="365" y="284" width="345" height="156" rx="8" class="dg-panel"/>
  <text x="375" y="306" class="dg-t" font-size="12" font-weight="700" text-anchor="start">한국 기업의 자리</text>
  <text x="375" y="327" class="dg-s" font-size="10.5" text-anchor="start">두산에너빌리티: 원자로·증기발생기 (첫 수혜)</text>
  <text x="375" y="348" class="dg-s" font-size="10.5" text-anchor="start">현대건설: EPC (Bechtel 쏠림의 대안)</text>
  <text x="375" y="369" class="dg-s" font-size="10.5" text-anchor="start">한전기술: 1·2차 설계, WEC 인력 부족</text>
  <text x="375" y="390" class="dg-s" font-size="10.5" text-anchor="start">한계: 한수원-WEC 합의로 북미 진출 제한</text>
  <text x="375" y="411" class="dg-s" font-size="10.5" text-anchor="start">  → 기자재 외 수혜는 초기 제한적 (KB·하나)</text>
</svg>
