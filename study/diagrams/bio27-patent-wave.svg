  <text x="360" y="348" class="dg-m" font-size="10.5" text-anchor="middle">FDA 3상 면제(요건 완화)가 확정되면 아래 줄이 더 빨라진다 — 대신 경쟁자도 는다. 셀트리온 3차 웨이브 = 2028~2030.</text>
  <text x="360" y="366" class="dg-m" font-size="10" text-anchor="middle">출처: 다올 Fig.40·42·69 · NH p.215. 셀트리온 개발 코드는 다올 Fig.68.</text>
