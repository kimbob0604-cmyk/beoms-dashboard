  <text x="500" y="137" class="dg-s" font-size="10.5" text-anchor="start">한국 계획 18.4GW (정부)</text>
  <text x="500" y="156" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">반도체 팹</text>
  <text x="500" y="175" class="dg-s" font-size="10.5" text-anchor="start">삼성 용인 9GW · SK하이닉스 6GW</text>
  <text x="500" y="194" class="dg-s" font-size="10.5" text-anchor="start">호남 6GW (교보)</text>
  <text x="500" y="213" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">전기화 · 산업</text>
  <text x="500" y="232" class="dg-s" font-size="10.5" text-anchor="start">미국 소비 +1.6% (2027, KB)</text>
  <text x="500" y="251" class="dg-s" font-size="10.5" text-anchor="start">한국 2040 최대전력 158~165GW</text>
  <text x="500" y="270" class="dg-s" font-size="10.5" text-anchor="start">(11차 대비 +23~28%, 미래)</text>
  <path d="M230 170 L246 170" class="dg-arrow" marker-end="url(#power-chainA)"/>
  <path d="M470 170 L486 170" class="dg-arrow" marker-end="url(#power-chainA)"/>
  <rect x="10" y="314" width="700" height="116" rx="8" class="dg-panel"/>
  <text x="20" y="334" class="dg-t" font-size="12.5" font-weight="800" text-anchor="start">돈과 규칙 — 누가 길 값을 내나</text>
  <text x="20" y="354" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">미국</text>
  <text x="20" y="372" class="dg-s" font-size="10.5" text-anchor="start">대형부하가 망 비용 부담 (FERC 206호·요금제)</text>
  <text x="20" y="390" class="dg-s" font-size="10.5" text-anchor="start">인허가 단축 (BAAJA) · 765kV 백본</text>
  <text x="20" y="408" class="dg-s" font-size="10.5" text-anchor="start">공제: 48E·45Y (원전 유지, 풍·태양 2027 시한)</text>
  <text x="370" y="354" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">한국</text>
  <text x="370" y="372" class="dg-s" font-size="10.5" text-anchor="start">요금: 한전 (2027 영업이익 4~11조로 갈림)</text>
  <text x="370" y="390" class="dg-s" font-size="10.5" text-anchor="start">12차 전기본 · 전력망 특별법 (민간 BT)</text>
  <text x="370" y="408" class="dg-s" font-size="10.5" text-anchor="start">LMP·지역요금 (2027) · RPS → 계약시장</text>
