<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="전력 밸류체인 지도: 발전원 → 계통 → 수요처, 아래는 돈과 규칙">
  <defs><marker id="power-chainA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="dg-arrowhead"/></marker></defs>
  <text x="360" y="20" class="dg-t" font-size="14" font-weight="800" text-anchor="middle">전력 밸류체인 — 전기는 넘치지 않고, 길(계통)이 막혔다</text>
  <rect x="10" y="34" width="220" height="270" rx="8" class="dg-lane2"/>
  <rect x="250" y="34" width="220" height="270" rx="8" class="dg-hi"/>
