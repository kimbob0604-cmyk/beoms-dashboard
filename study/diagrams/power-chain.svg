  <text x="20" y="118" class="dg-s" font-size="10.5" text-anchor="start">한전기술 · 한전KPS · 웨스팅하우스</text>
  <text x="20" y="137" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">가스터빈 · 연료전지</text>
  <text x="20" y="156" class="dg-s" font-size="10.5" text-anchor="start">두산에너빌리티 · GE Vernova</text>
  <text x="20" y="175" class="dg-s" font-size="10.5" text-anchor="start">Bloom · 두산퓨얼셀 · 비에이치아이</text>
  <text x="20" y="194" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">태양광 · 풍력</text>
  <text x="20" y="213" class="dg-s" font-size="10.5" text-anchor="start">한화솔루션 · OCI홀딩스</text>
  <text x="20" y="232" class="dg-s" font-size="10.5" text-anchor="start">HD현대에너지솔루션 · 씨에스윈드</text>
  <text x="20" y="251" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">발전 짓는 데 2~5년</text>
