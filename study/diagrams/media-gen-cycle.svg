  <rect x="552" y="190" width="99" height="28" rx="5" class="dg-hi"/>
  <text x="552" y="185" class="dg-s" font-size="9.5" text-anchor="start">2027F 1.02억 장 · 업사이클 (NH)</text>
  <text x="8" y="279" class="dg-t" font-size="11" font-weight="700" text-anchor="start">2027 신인</text>
