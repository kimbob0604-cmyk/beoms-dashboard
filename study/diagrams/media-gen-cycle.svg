  <rect x="6" y="358" width="708" height="96" rx="8" class="dg-panel"/>
  <text x="18" y="378" class="dg-t" font-size="9.8" text-anchor="start">연한 칸 = 데뷔 시기, 진한 칸 = 데뷔 3~5년차(팬덤이 쌓여 앨범당 판매·공연 규모가 가장 커지는 때). NH는 이 주기가 약 5년마다 돈다고 본다.</text>
  <text x="18" y="398" class="dg-t" font-size="9.8" text-anchor="start">교보의 근거: 데뷔 → 초동 밀리언셀러까지 3세대 평균 6.4년, 3세대 이후 1.8년. CORTIS는 1년이 안 걸렸다(0.7년). 수확기가 앞당겨지는 중.</text>
  <text x="18" y="418" class="dg-t" font-size="9.8" text-anchor="start">NH의 근거: 2024~25년엔 5세대 데뷔 비용이 마진을 눌렀고, 2026년 음반이 2년 만에 반등했다. 2027년은 5세대가 3~5년차로 들어서는 첫해.</text>
  <text x="18" y="440" class="dg-m" font-size="9" text-anchor="start">※ 세대 구분은 두 리포트의 분류(교보 p.17, NH p.128 주석)를 따랐다. 3세대의 수확기와 칸 길이는 리포트에 없어 표시하지 않았거나 대략이다.</text>
</svg>
