  <text x="586" y="166" class="dg-t" font-size="10" text-anchor="start">IDC 매출 1.46→20.9조</text>
  <text x="586" y="188" class="dg-s" font-size="10" text-anchor="start">   (2025→2030F)</text>
  <text x="586" y="210" class="dg-t" font-size="10" text-anchor="start">배당수익률 4.3~5.0%</text>
  <rect x="586" y="300" width="120" height="52" rx="6" class="dg-gate"/>
  <text x="646" y="321" class="dg-t" font-size="10.5" font-weight="700" text-anchor="middle">톱픽 SK텔레콤</text>
  <rect x="6" y="376" width="708" height="74" rx="8" class="dg-panel"/>
  <text x="18" y="398" class="dg-t" font-size="10.5" text-anchor="start">공통 배경: 2026년 엔터·미디어·레저 합산 시총은 시장의 0.5%까지 줄었다(NH). 테크·AI 랠리에서 완전히 소외된 해.</text>
  <text x="18" y="418" class="dg-t" font-size="10.5" text-anchor="start">2027년 논리: 엔터는 세대 사이클, 게임은 신작, 플랫폼·통신은 데이터센터 가동 — 모두 "숫자로 확인되는 해"라는 주장이다.</text>
  <text x="18" y="438" class="dg-s" font-size="10.5" text-anchor="start">교보는 엔터만(46쪽), NH는 다섯 칸 모두(약 60쪽). 엔터만 두 하우스를 맞대고, 나머지는 NH 한 곳의 시각이다.</text>
