  <text x="10" y="458" class="dg-s" font-size="10.5">자료: 하나(장비 반입 → 셋업 1년+, M15X 선례), DS·한투(캐파), 메리츠·유안타(P5·M17·Y2), IBK·삼성(후공정 시설). 일정은 리포트 시점(10~11월) 기준.</text>
  <text x="10" y="472" class="dg-s" font-size="10.5">자체 후공정 시설이 2027 말~2029에야 늘어서, 그사이 범용 메모리 후공정은 외주(OSAT)로 나간다(IBK·삼성).</text>
