<svg viewBox="0 0 720 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2026~2029 메모리 신규 팹과 후공정 시설 일정: 장비 반입에서 셋업까지 약 1년, 공급 기여는 2028년부터">
