<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="기술이전 계약 총액의 구성: 계약금, 개발 마일스톤, 허가 마일스톤, 상업 마일스톤, 로열티와 나라별 계약금 비중">
  <defs><marker id="bio27-deal-moneyA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="dg-arrowhead"/></marker></defs>
  <text x="360" y="20" class="dg-t" font-size="14" font-weight="800" text-anchor="middle">&quot;총 1조원 기술이전&quot;의 속 — 확정된 돈은 맨 위 한 칸</text>
  <rect x="60" y="40" width="150" height="34" rx="4" class="dg-hi"/>
  <text x="135.0" y="61.0" class="dg-t" font-size="11" font-weight="800" text-anchor="middle">계약금 (업프론트)</text>
  <line x1="216" y1="57.0" x2="240" y2="57.0" class="dg-arrow" marker-end="url(#bio27-deal-moneyA)"/>
  <text x="246" y="55.0" class="dg-s" font-size="10.5" text-anchor="start">계약 때 바로 받음 · 확정</text>
  <text x="246" y="70.0" class="dg-m" font-size="10" text-anchor="start">한국 평균 3.4% → 340억원</text>
  <rect x="60" y="76" width="150" height="70" rx="4" class="dg-mid"/>
  <text x="135.0" y="115.0" class="dg-t" font-size="11" font-weight="800" text-anchor="middle">개발 마일스톤</text>
  <line x1="216" y1="111.0" x2="240" y2="111.0" class="dg-arrow" marker-end="url(#bio27-deal-moneyA)"/>
  <text x="246" y="109.0" class="dg-s" font-size="10.5" text-anchor="start">1상·2상·3상 진입·성공 때</text>
  <text x="246" y="124.0" class="dg-m" font-size="10" text-anchor="start">실패하면 0</text>
  <rect x="60" y="148" width="150" height="70" rx="4" class="dg-mid"/>
  <text x="135.0" y="187.0" class="dg-t" font-size="11" font-weight="800" text-anchor="middle">허가 마일스톤</text>
  <line x1="216" y1="183.0" x2="240" y2="183.0" class="dg-arrow" marker-end="url(#bio27-deal-moneyA)"/>
  <text x="246" y="181.0" class="dg-s" font-size="10.5" text-anchor="start">미국·유럽 허가 때</text>
  <rect x="60" y="220" width="150" height="130" rx="4" class="dg-lo"/>
  <text x="135.0" y="289.0" class="dg-t" font-size="11" font-weight="800" text-anchor="middle">상업 마일스톤</text>
  <line x1="216" y1="285.0" x2="240" y2="285.0" class="dg-arrow" marker-end="url(#bio27-deal-moneyA)"/>
  <text x="246" y="283.0" class="dg-s" font-size="10.5" text-anchor="start">연 매출 목표 넘을 때</text>
  <text x="246" y="298.0" class="dg-m" font-size="10" text-anchor="start">대부분 &quot;최대치&quot; 조건</text>
  <text x="135.0" y="368" class="dg-t" font-size="11" font-weight="800" text-anchor="middle">= 발표되는 &quot;총 계약 규모&quot;</text>
  <rect x="60" y="378" width="150" height="26" rx="4" class="dg-band"/>
  <text x="135.0" y="395" class="dg-s" font-size="10" text-anchor="middle">+ 로열티 (매출의 몇 %, 총액 밖)</text>
  <text x="580" y="42" class="dg-t" font-size="11.5" font-weight="800" text-anchor="middle">총액 대비 계약금 비중 (2026, 다올)</text>
  <text x="540" y="75" class="dg-s" font-size="10.5" text-anchor="end">미국</text>
  <rect x="548" y="63" width="76.5" height="18" rx="3" class="dg-mid"/>
  <text x="630.5" y="76" class="dg-t" font-size="10.5" font-weight="800" text-anchor="start">10.2%</text>
  <text x="540" y="109" class="dg-s" font-size="10.5" text-anchor="end">중국</text>
  <rect x="548" y="97" width="48.0" height="18" rx="3" class="dg-mid"/>
  <text x="602.0" y="110" class="dg-t" font-size="10.5" font-weight="800" text-anchor="start">6.4%</text>
  <text x="540" y="143" class="dg-s" font-size="10.5" text-anchor="end">한국 평균</text>
  <rect x="548" y="131" width="25.5" height="18" rx="3" class="dg-hi"/>
  <text x="579.5" y="144" class="dg-t" font-size="10.5" font-weight="800" text-anchor="start">3.4%</text>
  <text x="540" y="177" class="dg-s" font-size="10.5" text-anchor="end">한미약품 3건</text>
  <rect x="548" y="165" width="61.49999999999999" height="18" rx="3" class="dg-hi"/>
  <text x="615.5" y="178" class="dg-t" font-size="10.5" font-weight="800" text-anchor="start">8.2%</text>
  <text x="540" y="211" class="dg-s" font-size="10.5" text-anchor="end">한미–제넨텍</text>
  <rect x="548" y="199" width="61.49999999999999" height="18" rx="3" class="dg-hi"/>
  <text x="615.5" y="212" class="dg-t" font-size="10.5" font-weight="800" text-anchor="start">8.2%</text>
  <text x="540" y="245" class="dg-s" font-size="10.5" text-anchor="end">바이오마린 건</text>
  <rect x="548" y="233" width="110.25" height="18" rx="3" class="dg-mid"/>
  <text x="664.25" y="246" class="dg-t" font-size="10.5" font-weight="800" text-anchor="start">14.7%</text>
  <text x="580" y="280" class="dg-s" font-size="10.5" text-anchor="middle">같은 1조원도 미국식이면 1,020억,</text>
  <text x="580" y="296" class="dg-s" font-size="10.5" text-anchor="middle">한국 평균이면 340억원이 손에 들어온다.</text>
  <text x="360" y="432" class="dg-m" font-size="10" text-anchor="middle">왼쪽 칸 높이(마일스톤 구성)는 이해를 돕는 예시다 — 계약마다 다르다. 오른쪽 숫자는 다올 Fig.11·82.</text>
</svg>
