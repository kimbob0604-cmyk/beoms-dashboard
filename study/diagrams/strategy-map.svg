<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2027 항해도: 자산배분 결론, 위험 4가지, 상반기와 하반기, 세 장의 역할">
  <defs><marker id="strategy-mapA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="dg-arrowhead"/></marker></defs>
  <text x="360" y="22" class="dg-t" font-size="14" font-weight="800" text-anchor="middle">2027 항해도 — AI 물결은 계속, 파고는 높아졌다</text>
  <rect x="10" y="36" width="220" height="96" rx="8" class="dg-hi"/>
  <text x="120" y="58" class="dg-t" font-size="13" font-weight="800" text-anchor="middle">주식 = 확대</text>
  <text x="20" y="80" class="dg-s" font-size="11" text-anchor="start">한국·미국 확대</text>
  <text x="20" y="96" class="dg-s" font-size="11" text-anchor="start">기타 신흥국 축소</text>
  <text x="20" y="112" class="dg-s" font-size="11" text-anchor="start">이익이 주가를 끈다</text>
  <rect x="250" y="36" width="220" height="96" rx="8" class="dg-hi"/>
  <text x="360" y="58" class="dg-t" font-size="13" font-weight="800" text-anchor="middle">채권 = 중립</text>
  <text x="260" y="80" class="dg-s" font-size="11" text-anchor="start">미국 투자등급만 확대</text>
  <text x="260" y="96" class="dg-s" font-size="11" text-anchor="start">10년물 4.80% (2027 평균)</text>
  <text x="260" y="112" class="dg-s" font-size="11" text-anchor="start">금리 하락 여지 작다</text>
  <rect x="490" y="36" width="220" height="96" rx="8" class="dg-hi"/>
  <text x="600" y="58" class="dg-t" font-size="13" font-weight="800" text-anchor="middle">대체 = 축소</text>
  <text x="500" y="80" class="dg-s" font-size="11" text-anchor="start">금(귀금속)만 확대</text>
  <text x="500" y="96" class="dg-s" font-size="11" text-anchor="start">원자재 변동성 확대</text>
  <text x="500" y="112" class="dg-s" font-size="11" text-anchor="start">안전자산 역할</text>
  <rect x="10" y="142" width="700" height="92" rx="8" class="dg-panel"/>
  <text x="20" y="162" class="dg-t" font-size="12" font-weight="800" text-anchor="start">위험 4가지 (모두 'AI가 너무 커졌다'에서 나온다)</text>
  <rect x="20" y="172" width="162" height="52" rx="6" class="dg-lane1"/>
  <text x="28" y="192" class="dg-t" font-size="11.5" font-weight="700" text-anchor="start">① AI 의존도</text>
  <text x="28" y="212" class="dg-s" font-size="10.5" text-anchor="start">상위 5종목 ≈30%</text>
  <rect x="192" y="172" width="162" height="52" rx="6" class="dg-lane1"/>
  <text x="200" y="192" class="dg-t" font-size="11.5" font-weight="700" text-anchor="start">② 고금리</text>
  <text x="200" y="212" class="dg-s" font-size="10.5" text-anchor="start">10년물 4.8%대</text>
  <rect x="364" y="172" width="162" height="52" rx="6" class="dg-lane1"/>
  <text x="372" y="192" class="dg-t" font-size="11.5" font-weight="700" text-anchor="start">③ 자금조달</text>
  <text x="372" y="212" class="dg-s" font-size="10.5" text-anchor="start">하이퍼 FCF −103십억$</text>
  <rect x="536" y="172" width="162" height="52" rx="6" class="dg-lane1"/>
  <text x="544" y="192" class="dg-t" font-size="11.5" font-weight="700" text-anchor="start">④ 정책</text>
  <text x="544" y="212" class="dg-s" font-size="10.5" text-anchor="start">부채한도·DC 규제</text>
  <rect x="10" y="244" width="345" height="80" rx="8" class="dg-lane2"/>
  <text x="20" y="264" class="dg-t" font-size="12" font-weight="800" text-anchor="start">상반기: 주식·채권 모두 우호</text>
  <text x="20" y="284" class="dg-s" font-size="10.5" text-anchor="start">물가 3.4 → 2.6% (디스인플레이션)</text>
  <text x="20" y="299.5" class="dg-s" font-size="10.5" text-anchor="start">현금이 남는 6개 바스켓 (빅파마·소프트웨어 …)</text>
  <rect x="365" y="244" width="345" height="80" rx="8" class="dg-lane3"/>
  <text x="375" y="264" class="dg-t" font-size="12" font-weight="800" text-anchor="start">하반기: 위험 관리</text>
  <text x="375" y="284" class="dg-s" font-size="10.5" text-anchor="start">부채한도 X-Date (2027년 말) · 당대회 (10월)</text>
  <text x="375" y="299.5" class="dg-s" font-size="10.5" text-anchor="start">하이퍼 FCF 재축적 → AI·Physical AI</text>
  <path d="M355 284 L363 284" class="dg-arrow" marker-end="url(#strategy-mapA)"/>
  <text x="360" y="348" class="dg-t" font-size="12.5" font-weight="800" text-anchor="middle">세 장이 맡은 것</text>
  <rect x="10" y="358" width="220" height="130" rx="8" class="dg-panel"/>
  <text x="120" y="380" class="dg-t" font-size="12.5" font-weight="800" text-anchor="middle">I. 자산배분</text>
  <text x="20" y="404" class="dg-s" font-size="11" text-anchor="start">무엇을 얼마나</text>
  <text x="20" y="426" class="dg-s" font-size="11" text-anchor="start">주식·채권·금·환율</text>
  <text x="20" y="448" class="dg-s" font-size="11" text-anchor="start">테마 ETF 6개</text>
  <rect x="250" y="358" width="220" height="130" rx="8" class="dg-panel"/>
  <text x="360" y="380" class="dg-t" font-size="12.5" font-weight="800" text-anchor="middle">II. 국가 전략</text>
  <text x="260" y="404" class="dg-s" font-size="11" text-anchor="start">어디서</text>
  <text x="260" y="426" class="dg-s" font-size="11" text-anchor="start">미국 Core (S&amp;P 9,500)</text>
  <text x="260" y="448" class="dg-s" font-size="11" text-anchor="start">중국 바벨 · 베트남 개방</text>
  <rect x="490" y="358" width="220" height="130" rx="8" class="dg-panel"/>
  <text x="600" y="380" class="dg-t" font-size="12.5" font-weight="800" text-anchor="middle">III. 해외 산업</text>
  <text x="500" y="404" class="dg-s" font-size="11" text-anchor="start">무엇을</text>
  <text x="500" y="426" class="dg-s" font-size="11" text-anchor="start">AI 활용·CPU·기판 병목</text>
  <text x="500" y="448" class="dg-s" font-size="11" text-anchor="start">Non-AI · 유망 11종목</text>
</svg>
