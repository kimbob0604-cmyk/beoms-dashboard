<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="통신사 현금흐름: 5G 성숙에서 나온 현금이 배당과 AI 데이터센터 투자로 나뉜다">
  <defs><marker id="media-telco-cashA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="dg-arrowhead"/></marker></defs>
  <text x="360" y="20" class="dg-t" font-size="14" font-weight="800" text-anchor="middle">통신 3사 — 5G가 늙어서 생긴 현금, 배당과 데이터센터로 나눈다</text>
  <rect x="6" y="40" width="220" height="250" rx="8" class="dg-lane2"/>
  <text x="18" y="62" class="dg-t" font-size="12" font-weight="800" text-anchor="start">본업 (무선·유선)</text>
  <text x="18" y="88" class="dg-t" font-size="10" text-anchor="start">5G 보급률 87.2% (2027말 전망)</text>
  <text x="18" y="112" class="dg-t" font-size="10" text-anchor="start">5G 가입자 4,073만 명</text>
  <text x="18" y="136" class="dg-t" font-size="10" text-anchor="start">3G→4G→5G 약 8년 주기</text>
  <text x="18" y="160" class="dg-t" font-size="10" text-anchor="start">6G는 2030년 → 5G 수명이 길다</text>
  <text x="18" y="184" class="dg-t" font-size="10" text-anchor="start">마케팅비: 해킹 사태 뒤 다시 안정</text>
  <text x="18" y="208" class="dg-t" font-size="10" text-anchor="start">5G CapEx 정점 지나 하향</text>
  <text x="18" y="232" class="dg-t" font-size="10" text-anchor="start">감가상각비: 초기 5G 장비 내용</text>
  <text x="18" y="256" class="dg-s" font-size="10" text-anchor="start">   연수 만료가 상쇄 → 안정</text>
  <rect x="272" y="120" width="170" height="90" rx="8" class="dg-hi"/>
  <text x="357" y="150" class="dg-t" font-size="12.5" font-weight="800" text-anchor="middle">안정적 현금흐름</text>
  <text x="357" y="172" class="dg-t" font-size="10" text-anchor="middle">2027 영업이익 5.4조</text>
  <text x="357" y="190" class="dg-s" font-size="9.5" text-anchor="middle">(SKT 1.96·KT 2.1·LGU 1.3)</text>
  <line x1="228" y1="165" x2="268" y2="165" class="dg-arrow" marker-end="url(#media-telco-cashA)"/>
  <rect x="490" y="40" width="224" height="120" rx="8" class="dg-lane3"/>
  <text x="502" y="62" class="dg-t" font-size="12" font-weight="800" text-anchor="start">① 주주환원</text>
  <text x="502" y="84" class="dg-t" font-size="9.5" text-anchor="start">2027F 배당수익률</text>
  <text x="502" y="100" class="dg-s" font-size="9.5" text-anchor="start">   SKT 4.3% · KT 5.0% · LGU 4.4%</text>
  <text x="502" y="116" class="dg-t" font-size="9.5" text-anchor="start">KT 자사주 5천억 원 (2028까지)</text>
  <text x="502" y="132" class="dg-s" font-size="9.5" text-anchor="start">   → 주주환원수익률 10.3%</text>
  <text x="502" y="148" class="dg-t" font-size="9.5" text-anchor="start">LGU 자사주 900억 (2026)</text>
  <rect x="490" y="170" width="224" height="120" rx="8" class="dg-lane1"/>
  <text x="502" y="192" class="dg-t" font-size="12" font-weight="800" text-anchor="start">② AI 데이터센터 투자</text>
  <text x="502" y="214" class="dg-t" font-size="9.5" text-anchor="start">2027 CapEx 7.3조 (+14.4%)</text>
  <text x="502" y="230" class="dg-s" font-size="9.5" text-anchor="start">   SKT 2.9 · KT 2.3 · LGU 2.0조</text>
  <text x="502" y="246" class="dg-t" font-size="9.5" text-anchor="start">일부는 외부 투자 유치</text>
  <text x="502" y="262" class="dg-t" font-size="9.5" text-anchor="start">IDC 매출 1.46조(2025)</text>
  <text x="502" y="278" class="dg-s" font-size="9.5" text-anchor="start">   → 20.9조(2030F), 연 70.4%</text>
  <line x1="444" y1="150" x2="486" y2="100" class="dg-arrow" marker-end="url(#media-telco-cashA)"/>
  <line x1="444" y1="180" x2="486" y2="230" class="dg-arrow" marker-end="url(#media-telco-cashA)"/>
  <rect x="6" y="300" width="708" height="112" rx="8" class="dg-panel"/>
  <text x="18" y="322" class="dg-t" font-size="10" text-anchor="start">핵심 긴장: 데이터센터를 지을수록 CapEx가 늘어 배당 여력과 부딪힌다. NH는 5G 투자 감소가 이를 상쇄해 배당이 유지된다고 본다.</text>
  <text x="18" y="342" class="dg-t" font-size="10" text-anchor="start">매출 비중 변화: 통신 3사 매출 중 IDC 2.4%(2025) → 25.3%(2030F). 주요 데이터센터가 완공되는 2028년부터 매출이 크게 는다.</text>
  <text x="18" y="362" class="dg-t" font-size="10" text-anchor="start">외부 변수: 스타링크 모바일(위성+지상 5G)은 미국 3사엔 위협이지만, 한국은 주파수 경매·전국 기지국 의무·외국인 지분 49% 제한으로 영향이 작다.</text>
  <text x="18" y="382" class="dg-s" font-size="10" text-anchor="start">그래서 NH의 통신 톱픽은 "배당을 지키면서 데이터센터가 가장 큰" SK텔레콤이다(목표주가 125,000원).</text>
  <text x="18" y="402" class="dg-m" font-size="9" text-anchor="start">※ 숫자는 NH p.114~119.</text>
</svg>
