<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="한국전력 2027년 영업이익 전망: 하우스별 4.1~11.2조원과 그 가정">
  <defs><marker id="power-kepco-ladderA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="dg-arrowhead"/></marker></defs>
  <text x="360" y="20" class="dg-t" font-size="14" font-weight="800" text-anchor="middle">한전 2027F 영업이익: 같은 회사, 4.1조에서 11.2조까지</text>
  <line x1="60" y1="70" x2="690" y2="70" class="dg-axis"/>
  <line x1="60.0" y1="66" x2="60.0" y2="74" class="dg-axis"/>
  <text x="60.0" y="88" class="dg-m" font-size="10" text-anchor="middle">0조</text>
  <line x1="150.0" y1="66" x2="150.0" y2="74" class="dg-axis"/>
  <text x="150.0" y="88" class="dg-m" font-size="10" text-anchor="middle">2조</text>
  <line x1="240.0" y1="66" x2="240.0" y2="74" class="dg-axis"/>
  <text x="240.0" y="88" class="dg-m" font-size="10" text-anchor="middle">4조</text>
  <line x1="330.0" y1="66" x2="330.0" y2="74" class="dg-axis"/>
  <text x="330.0" y="88" class="dg-m" font-size="10" text-anchor="middle">6조</text>
  <line x1="420.0" y1="66" x2="420.0" y2="74" class="dg-axis"/>
  <text x="420.0" y="88" class="dg-m" font-size="10" text-anchor="middle">8조</text>
  <line x1="510.0" y1="66" x2="510.0" y2="74" class="dg-axis"/>
  <text x="510.0" y="88" class="dg-m" font-size="10" text-anchor="middle">10조</text>
  <line x1="600.0" y1="66" x2="600.0" y2="74" class="dg-axis"/>
  <text x="600.0" y="88" class="dg-m" font-size="10" text-anchor="middle">12조</text>
  <line x1="690.0" y1="66" x2="690.0" y2="74" class="dg-axis"/>
  <text x="690.0" y="88" class="dg-m" font-size="10" text-anchor="middle">14조</text>
  <circle cx="244.5" cy="70" r="5" class="dg-no"/>
  <text x="244.5" y="52" class="dg-t" font-size="10" font-weight="700" text-anchor="middle">신한 4.1</text>
  <circle cx="246.8" cy="70" r="5" class="dg-no"/>
  <text x="246.75" y="106" class="dg-t" font-size="10" font-weight="700" text-anchor="middle">DS 4.15</text>
  <circle cx="266.5" cy="70" r="5" class="dg-no"/>
  <text x="266.54999999999995" y="120" class="dg-t" font-size="10" font-weight="700" text-anchor="middle">하나 4.59</text>
  <circle cx="438.0" cy="70" r="5" class="dg-ok"/>
  <text x="438.0" y="52" class="dg-t" font-size="10" font-weight="700" text-anchor="middle">메리츠 본문 8.4</text>
  <circle cx="482.1" cy="70" r="5" class="dg-ok"/>
  <text x="482.1" y="106" class="dg-t" font-size="10" font-weight="700" text-anchor="middle">교보 9.38</text>
  <circle cx="523.0" cy="70" r="5" class="dg-ok"/>
  <text x="523.05" y="120" class="dg-t" font-size="10" font-weight="700" text-anchor="middle">컨센서스 10.29</text>
  <circle cx="561.8" cy="70" r="5" class="dg-ok"/>
  <text x="561.75" y="52" class="dg-t" font-size="10" font-weight="700" text-anchor="middle">메리츠 표 11.15</text>
  <circle cx="667.1" cy="70" r="5" class="dg-m"/>
  <text x="667.0500000000001" y="106" class="dg-t" font-size="10" font-weight="700" text-anchor="middle">2025 실적 13.49</text>
  <text x="60" y="140" class="dg-s" font-size="10.5" text-anchor="start">2026F는 6.7~8.9조 (교보·DS 6.7, 하나 7.4, 신한 7.6, 메리츠 8.9)</text>
  <rect x="10" y="152" width="345" height="258" rx="8" class="dg-lane2"/>
  <text x="20" y="174" class="dg-t" font-size="12" font-weight="700" text-anchor="start">낮게 보는 쪽 (4.1~4.6조)</text>
  <text x="20" y="195" class="dg-s" font-size="10.5" text-anchor="start">신한: 두바이 90달러 · SMP 127원 · 환율 1,340원</text>
  <text x="20" y="216" class="dg-s" font-size="10.5" text-anchor="start">  판매단가 169원, 원가 반영 하반기부터</text>
  <text x="20" y="237" class="dg-s" font-size="10.5" text-anchor="start">DS: 연료비 단가 +40%인데</text>
  <text x="20" y="258" class="dg-s" font-size="10.5" text-anchor="start">  연료비조정단가 상한은 +5원뿐</text>
  <text x="20" y="279" class="dg-s" font-size="10.5" text-anchor="start">  원전 4기 복귀(2Q27) 가정에도 −38%</text>
  <text x="20" y="300" class="dg-s" font-size="10.5" text-anchor="start">하나: 겨울(슈퍼 엘니뇨)·호르무즈가 변수</text>
  <text x="20" y="321" class="dg-s" font-size="10.5" text-anchor="start">  지역요금 영향은 추정에 미반영</text>
  <text x="20" y="342" class="dg-s" font-size="10.5" text-anchor="start">  → 반영하면 더 낮아진다</text>
  <rect x="365" y="152" width="345" height="258" rx="8" class="dg-lane1"/>
  <text x="375" y="174" class="dg-t" font-size="12" font-weight="700" text-anchor="start">높게 보는 쪽 (9.4~11.2조)</text>
  <text x="375" y="195" class="dg-s" font-size="10.5" text-anchor="start">교보: 연료비 22.5 → 18.9조 (−16%)</text>
  <text x="375" y="216" class="dg-s" font-size="10.5" text-anchor="start">  구입전력비 38.3 → 39.0조</text>
  <text x="375" y="237" class="dg-s" font-size="10.5" text-anchor="start">메리츠: 두바이 82.8달러 · SMP 121.8원</text>
  <text x="375" y="258" class="dg-s" font-size="10.5" text-anchor="start">  표 11.15조 (+24.9%) · 본문 8.4조 (−5.2%)</text>
  <text x="375" y="279" class="dg-s" font-size="10.5" text-anchor="start">  — 같은 리포트 안에서도 갈린다</text>
  <text x="375" y="300" class="dg-t" font-size="10.5" font-weight="700" text-anchor="start">공통 하방 위험</text>
  <text x="375" y="321" class="dg-s" font-size="10.5" text-anchor="start">지역요금 −2.4~3.6조, 한전채 한도 일몰</text>
  <text x="375" y="342" class="dg-s" font-size="10.5" text-anchor="start">→ 요금 인상 대신 증자·차등요금 (메리츠)</text>
</svg>
