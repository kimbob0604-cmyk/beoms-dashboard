<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HBM이 DRAM 웨이퍼를 잠식하는 구조: 2027년 새 캐파 약 250K 중 범용 증가는 110K, HBM 웨이퍼 31%에서 비트는 13%">
  <text x="360" y="20" text-anchor="middle" class="dg-t" font-size="14" font-weight="800">2027년 새 캐파의 절반 이상을 HBM이 가져간다</text>
  <!-- 왼쪽: 3사 캐파 -->
  <rect x="8" y="34" width="392" height="340" rx="8" class="dg-out"/>
  <text x="18" y="54" class="dg-t" font-size="12" font-weight="800">3사 DRAM 캐파 (연말, 천 장/월) — 한투</text>
  <g font-size="10" class="dg-s"><rect x="262" y="45" width="12" height="10" class="dg-io"/><text x="278" y="54">범용</text><rect x="312" y="45" width="12" height="10" class="dg-tki"/><text x="328" y="54">HBM</text></g>
  <line x1="24" y1="320" x2="384" y2="320" class="dg-axis"/>
  <!-- 삼성 -->
  <rect x="40" y="195.4" width="34" height="124.6" class="dg-io"/><rect x="40" y="143.7" width="34" height="51.7" class="dg-tki"/>
  <rect x="86" y="183.7" width="34" height="136.3" class="dg-io"/><rect x="86" y="120.2" width="34" height="63.5" class="dg-tki"/>
  <!-- SK -->
  <rect x="160" y="226" width="34" height="94" class="dg-io"/><rect x="160" y="176.6" width="34" height="49.4" class="dg-tki"/>
  <rect x="206" y="216.6" width="34" height="103.4" class="dg-io"/><rect x="206" y="157.8" width="34" height="58.8" class="dg-tki"/>
  <!-- 마이크론 -->
  <rect x="280" y="251.8" width="34" height="68.2" class="dg-io"/><rect x="280" y="230.6" width="34" height="21.2" class="dg-tki"/>
  <rect x="326" y="247.1" width="34" height="72.9" class="dg-io"/><rect x="326" y="216.5" width="34" height="30.6" class="dg-tki"/>
  <g font-size="10" text-anchor="middle" class="dg-t">
    <text x="57" y="138">750</text><text x="103" y="114" font-weight="700">850</text>
    <text x="177" y="171">610</text><text x="223" y="152" font-weight="700">690</text>
    <text x="297" y="225">380</text><text x="343" y="211" font-weight="700">440</text>
  </g>
  <g font-size="9.5" text-anchor="middle" class="dg-s">
    <text x="57" y="262">530</text><text x="57" y="174">220</text><text x="103" y="256">580</text><text x="103" y="156">270</text>
    <text x="177" y="277">400</text><text x="177" y="205">210</text><text x="223" y="272">440</text><text x="223" y="191">250</text>
    <text x="297" y="290">290</text><text x="343" y="288">310</text><text x="343" y="236">130</text>
  </g>
  <g font-size="10" text-anchor="middle" class="dg-m">
    <text x="57" y="334">26F</text><text x="103" y="334">27F</text><text x="177" y="334">26F</text><text x="223" y="334">27F</text><text x="297" y="334">26F</text><text x="343" y="334">27F</text>
  </g>
  <g font-size="11.5" font-weight="800" text-anchor="middle" class="dg-t">
    <text x="80" y="352">삼성전자</text><text x="200" y="352">SK하이닉스</text><text x="320" y="352">마이크론</text>
  </g>
  <g font-size="10" text-anchor="middle" class="dg-s">
    <text x="80" y="367">범용 +50 · HBM +50</text><text x="200" y="367">범용 +40 · HBM +40</text><text x="320" y="367">범용 +20 · HBM +40</text>
  </g>
  <!-- 오른쪽: 늘어난 250K -->
  <rect x="412" y="34" width="300" height="340" rx="8" class="dg-out"/>
  <text x="422" y="54" class="dg-t" font-size="12" font-weight="800">① 늘어난 약 250K는 어디로?</text>
  <rect x="424" y="66" width="152" height="30" class="dg-tki"/><rect x="576" y="66" width="128" height="30" class="dg-io"/>
  <text x="500" y="86" text-anchor="middle" class="dg-t" font-size="11" font-weight="700">HBM +130K</text>
  <text x="640" y="86" text-anchor="middle" class="dg-t" font-size="11" font-weight="700">범용 +110K</text>
  <text x="422" y="114" class="dg-s" font-size="10.5">범용 캐파는 +9%뿐 → 2027 범용 공급 증가 미미</text>
  <line x1="420" y1="128" x2="704" y2="128" class="dg-div"/>
  <text x="422" y="148" class="dg-t" font-size="12" font-weight="800">② 웨이퍼는 많이, 비트는 적게 — DS</text>
  <g font-size="10.5" class="dg-s">
    <text x="422" y="172">2025</text><text x="422" y="226">2027E</text>
  </g>
  <g font-size="10" class="dg-s"><text x="462" y="164">웨이퍼 중 HBM</text><text x="462" y="190">비트 중 HBM</text><text x="462" y="218">웨이퍼 중 HBM</text><text x="462" y="244">비트 중 HBM</text></g>
  <rect x="540" y="156" width="160" height="12" rx="2" class="dg-lo"/><rect x="540" y="156" width="30.4" height="12" rx="2" class="dg-tki"/>
  <rect x="540" y="182" width="160" height="12" rx="2" class="dg-lo"/><rect x="540" y="182" width="12.8" height="12" rx="2" class="dg-tki"/>
  <rect x="540" y="210" width="160" height="12" rx="2" class="dg-lo"/><rect x="540" y="210" width="49.6" height="12" rx="2" class="dg-tki"/>
  <rect x="540" y="236" width="160" height="12" rx="2" class="dg-lo"/><rect x="540" y="236" width="20.8" height="12" rx="2" class="dg-tki"/>
  <g font-size="10" font-weight="700" class="dg-t"><text x="574" y="166">19%</text><text x="556" y="192">8%</text><text x="594" y="220">31%</text><text x="564" y="246">13%</text></g>
  <line x1="420" y1="262" x2="704" y2="262" class="dg-div"/>
  <text x="422" y="282" class="dg-t" font-size="12" font-weight="800">③ 왜 웨이퍼를 더 먹나</text>
  <g font-size="10.5" class="dg-s">
    <text x="422" y="301">· HBM 코어 다이가 범용보다 크고 TSV 자리를 쓴다</text>
    <text x="422" y="318">· 쌓은 뒤 한 장만 불량이어도 스택 전체를 버린다</text>
    <text x="422" y="335">· 같은 비트에 웨이퍼 약 3배 (교환비 2.4 → 3.5배, iM)</text>
    <text x="422" y="352">· 신규 팹의 본격 기여는 2028년부터</text>
  </g>
  <text x="8" y="394" class="dg-s" font-size="10.5">자료: 한국투자(p.12~13, 2027 신규 캐파 약 250K 중 범용 실질 증분 약 110K), DS(p.25), iM(p.38). 그림 막대는 각 사 연말 캐파.</text>
  <text x="8" y="410" class="dg-s" font-size="10.5">HBM 웨이퍼 비중 2027 약 30%는 KB(TrendForce)·신한·유안타도 같다(iM은 35%).</text>
</svg>
