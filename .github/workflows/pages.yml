# 공개 사이트 배포: gh-pages 브랜치의 지금 내용을 GitHub Pages 로 올린다.
#
# 브랜치에서 바로 배포하면(legacy) 시간당 빌드 10회 한도가 있어 10분 간격이 한계였다. 사용자 워크플로로 올리면 그 한도가 없다
# (docs.github.com/pages/getting-started-with-github-pages/github-pages-limits). 그래서 2026-11-19 부터 Pages 소스를
# 'GitHub Actions' 로 두고, 맥(publish.py)과 cloud-live 가 gh-pages 를 푸시한 뒤 이 워크플로를 부른다 → 1분마다 갱신.
# 줄 서 있는 배포는 가장 새 것 하나만 남고(concurrency), 실행할 때 gh-pages 의 최신 커밋을 받으므로 늘 마지막 내용이 올라간다.
#
# 2026-11-26: 배포 번호(pages_build_version)가 main 커밋 번호라, main 이 그대로면 매번 같은 번호가 된다. 이날 11:22 이후 같은 번호의 배포가
# '성공'으로 끝나도 사이트에 반영되지 않았다. 그래서 deploy-pages 대신 Pages 배포 API 를 직접 불러, 배포 번호를
# 그 gh-pages 커밋 번호로 붙인다(배포마다 새 커밋이라 번호가 매번 다르다)(아티팩트도 이름 대신 번호로 넘겨 '아티팩트 없음' 오류도 없어진다).
#
# 되돌리기: gh api -X PUT repos/<저장소>/pages -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/'
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - id: ver
        run: echo "v=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: art
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      # 배포 번호를 매번 다르게: POST /pages/deployments (deploy-pages 가 하는 일과 같고, pages_build_version 만 우리가 정한다)
      - id: deploy
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.art.outputs.artifact_id }}
          VER: ${{ steps.ver.outputs.v }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const VER = process.env.VER;
            // 만들기 → 상태 확인. 'deployment_failed' 가 가끔 그냥 나는데 같은 내용으로 다시 만들면 된다(2026-11-26) → 최대 3번
            for (let attempt = 1; attempt <= 3; attempt++) {
              let dep = null;
              for (let i = 0; i < 4 && !dep; i++) {
                try {
                  dep = (await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                    owner, repo, artifact_id: Number(process.env.ARTIFACT_ID), pages_build_version: VER, oidc_token: await core.getIDToken() })).data;
                } catch (e) { core.warning(`배포 만들기 실패 ${i + 1}: ${e.message}`); if (i === 3) throw e; await sleep(15000); }
              }
              core.info(`배포 ${VER} (${attempt}번째) → ${dep.page_url}`);
              core.setOutput('page_url', dep.page_url);
              let st = '';
              for (let i = 0; i < 120; i++) {
                st = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id: VER })).data.status;
                if (st === 'succeed' || /fail|error|lost|cancel/i.test(st)) break;
                await sleep(5000);
              }
              if (st === 'succeed') { core.info('배포 완료'); return; }
              core.warning(`배포 상태 ${st} — ${attempt < 3 ? '20초 뒤 다시' : '포기'}`);
              await sleep(20000);
            }
            core.setFailed('배포가 3번 모두 끝나지 않음');
