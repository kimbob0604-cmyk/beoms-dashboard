# 공개 사이트 배포: gh-pages 브랜치의 지금 내용을 GitHub Pages 로 올린다.
#
# 브랜치에서 바로 배포하면(legacy) 시간당 빌드 10회 한도가 있어 10분 간격이 한계였다. 사용자 워크플로로 올리면 그 한도가 없다
# (docs.github.com/pages/getting-started-with-github-pages/github-pages-limits). 그래서 2026-11-19 부터 Pages 소스를
# 'GitHub Actions' 로 두고, 맥(publish.py)과 cloud-live 가 gh-pages 를 푸시한 뒤 이 워크플로를 부른다 → 1분마다 갱신.
# 줄 서 있는 배포는 가장 새 것 하나만 남고(concurrency), 실행할 때 gh-pages 의 최신 커밋을 받으므로 늘 마지막 내용이 올라간다.
#
# 2026-11-26: 배포 번호(pages_build_version)가 main 커밋 번호라, main 이 그대로면 매번 같은 번호가 된다. 이날 11:22 이후 같은 번호의 배포가
# '성공'으로 끝나도 사이트에 반영되지 않았다 → main 을 한 번 바꿔 번호를 새로 만든다.
#
# 되돌리기: gh api -X PUT repos/<저장소>/pages -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/'
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      # 업로드 직후 deploy-pages 가 아티팩트 목록을 조회하면 아직 등록 전이라
      # 'No artifacts named "github-pages"' 로 실패할 때가 있다(2026-11-24 기준 25회 중 9회).
      # 이 오류는 배포를 만들기 전에 나므로, 잠깐 기다렸다 한 번 더 부르면 된다.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
